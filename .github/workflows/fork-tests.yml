name: Fork tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Pins match the suite's shared gate (craft-common-actions gate.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # These four crates have no system-library dependencies (no -sys or windowing crates in
      # their dependency tree), so no apt packages are installed on Linux.
      - name: Run crate tests
        run: cargo test --release -j 4 -p effectcraft-aep-native -p effectcraft-keyframe -p effectcraft-path -p effectcraft-project
